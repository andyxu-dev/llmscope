[project]
name = "llmscope"
version = "0.1.0"
description = "Open-source library for visualizing LLM inference internals."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [ { name = "llmscope community" } ]
keywords = [ "llm", "inference", "visualization", "kv cache", "attention", "memory" ]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "torch>=2.0",
    "transformers>=4.35",
    "pydantic>=2.0",
    "numpy",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.100",
    "uvicorn[standard]",
    "httpx",
]
dashboard = [
    "streamlit>=1.28",
    "plotly>=5.0",
]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-cov",
    "llmscope[server]",
]

[project.scripts]
llmscope = "llmscope.cli:main"

[build-system]
requires = ["hatchling>=1.15.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llmscope"]

[tool.hatch.build.targets.sdist]
include = ["src/llmscope/**"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["streamlit", "streamlit.*", "plotly", "plotly.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 88
target-version = "py39"
exclude = [".git", "build", "dist", "src/llmscope/frontend"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "--cov=src --cov-report=term-missing"
testpaths = ["tests"]
